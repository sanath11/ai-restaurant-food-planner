bundle:
  name: agent_openai_agents_sdk

resources:
  apps:
    agent_openai_agents_sdk:
      name: "agent-openai-agents-sdk"
      description: "OpenAI Agents SDK agent application"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: ""
            permission: 'CAN_MANAGE'
        
        # Serving endpoint for LLM inference
        - name: 'llama_endpoint'
          serving_endpoint:
            serving_endpoint_name: 'databricks-meta-llama-3-3-70b-instruct'
            permission: 'CAN_QUERY'
        
        # Custom app - meal planner MCP server
        # Replace 'ai-restaurant-food-planner' with actual deployed app name
        - name: 'meal_planner_app'
          app:
            app_name: 'ai-restaurant-food-planner'
            permission: 'CAN_USE'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_openai_agents_sdk:
          name: agent-openai-agents-sdk
